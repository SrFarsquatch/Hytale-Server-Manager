name: realmkeeper
services:
  manager:
    image: ghcr.io/srfarsquatch/realmkeeper:latest
    container_name: realmkeeper
    restart: unless-stopped
    # Hytale OAuth/device authentication needs working DNS inside this container.
    # The server processes are launched by the manager, so this resolver config
    # also applies to their outbound authentication requests.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8008:8008/tcp"
      - "5520:5520/udp"
      - "5520:5520/tcp"
      - "5521:5521/udp"
      - "5521:5521/tcp"
      - "5522:5522/udp"
      - "5522:5522/tcp"
      - "5523:5523/udp"
      - "5523:5523/tcp"
      - "5524:5524/udp"
      - "5524:5524/tcp"
      - "5525:5525/udp"
      - "5525:5525/tcp"
      # RuneScape: Dragonwilds servers always use UDP 7777-7782.
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "7779:7779/udp"
      - "7780:7780/udp"
      - "7781:7781/udp"
      - "7782:7782/udp"
      # Minecraft Java servers use TCP 25565-25570, starting at the game's default port.
      - "25565:25565/tcp"
      - "25566:25566/tcp"
      - "25567:25567/tcp"
      - "25568:25568/tcp"
      - "25569:25569/tcp"
      - "25570:25570/tcp"
    volumes:
      - type: bind
        source: /DATA/AppData/realmkeeper
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    environment:
      REALMKEEPER_DATA_DIR: /data
      REALMKEEPER_LISTEN: ":8008"
      REALMKEEPER_GAME_PORT_START: "5520"
      REALMKEEPER_GAME_PORT_END: "5525"
      REALMKEEPER_MINECRAFT_PORT_START: "25565"
      REALMKEEPER_MINECRAFT_PORT_END: "25570"
      TZ: America/Vancouver
    stop_grace_period: 100s
x-casaos:
  architectures:
    - amd64
    - arm64
  main: manager
  author: Community
  category: Games
  description:
    en_us: Self-hosted panel for Hytale, Minecraft Java, RuneScape Dragonwilds and Terraria dedicated servers.
  developer: Community
  index: /
  port_map: "8008"
  scheme: http
  store_app_id: realmkeeper
  tagline:
    en_us: Run and manage your game servers from one panel.
  title:
    en_us: Realmkeeper
