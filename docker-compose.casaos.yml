name: hytale-server-manager
services:
  manager:
    image: ghcr.io/srfarsquatch/hytale-server-manager:latest
    container_name: hytale-server-manager
    restart: unless-stopped
    # Hytale OAuth/device authentication needs working DNS inside this container.
    # The server processes are launched by the manager, so this resolver config
    # also applies to their outbound authentication requests.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8008:8008/tcp"
      - "5520:5520/udp"
      - "5520:5520/tcp"
      - "5521:5521/udp"
      - "5521:5521/tcp"
      - "5522:5522/udp"
      - "5522:5522/tcp"
      - "5523:5523/udp"
      - "5523:5523/tcp"
      - "5524:5524/udp"
      - "5524:5524/tcp"
      - "5525:5525/udp"
      - "5525:5525/tcp"
    volumes:
      - type: bind
        source: /DATA/AppData/hytale-server-manager
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    environment:
      HSM_DATA_DIR: /data
      HSM_LISTEN: ":8008"
      HSM_GAME_PORT_START: "5520"
      HSM_GAME_PORT_END: "5525"
      TZ: America/Vancouver
    stop_grace_period: 100s
x-casaos:
  architectures:
    - amd64
    - arm64
  main: manager
  author: Community
  category: Games
  description:
    en_us: Self-hosted multi-server manager for Hytale dedicated servers.
  developer: Community
  index: /
  port_map: "8008"
  scheme: http
  store_app_id: hytale-server-manager
  tagline:
    en_us: Run and manage multiple Hytale servers from one panel.
  title:
    en_us: Hytale Server Manager
