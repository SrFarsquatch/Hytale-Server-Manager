name: Publish stable release automatically

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "version=0.6.$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish stable images
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/srfarsquatch/hytale-server-manager:v${{ steps.version.outputs.version }}
            ghcr.io/srfarsquatch/hytale-server-manager:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SrFarsquatch/Hytale-Server-Manager
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}

      - name: Create stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
