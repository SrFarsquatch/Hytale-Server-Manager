name: Publish manual stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable semantic version without the v prefix (for example 0.6.1)"
        required: true
        type: string
      target_branch:
        description: "Branch to release after its changes are merged"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semantic X.Y.Z without a leading v."
            exit 1
          fi

      - name: Check out release target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish stable image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ inputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/srfarsquatch/hytale-server-manager:v${{ inputs.version }}
            ghcr.io/srfarsquatch/hytale-server-manager:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SrFarsquatch/Hytale-Server-Manager
            org.opencontainers.image.version=v${{ inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ inputs.target_branch }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
