name: Go checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Check browser JavaScript syntax
        run: node --check cmd/hsm/web/app.js
      - name: Run vet
        run: go vet ./...
      - name: Build application
        run: go build -trimpath -o /tmp/hytale-server-manager ./cmd/hsm
      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.casaos.yml config -q
      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=0.6.0 -t hytale-server-manager:ci .