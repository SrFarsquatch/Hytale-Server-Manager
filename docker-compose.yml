name: hytale-server-manager
services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hytale-server-manager
    restart: unless-stopped
    # Hytale OAuth/device authentication needs working DNS inside this container.
    # The server processes are launched by the manager, so this resolver config
    # also applies to their outbound authentication requests.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8008:8008/tcp"
      - "5520:5520/udp"
      - "5520:5520/tcp"
      - "5521:5521/udp"
      - "5521:5521/tcp"
      - "5522:5522/udp"
      - "5522:5522/tcp"
      - "5523:5523/udp"
      - "5523:5523/tcp"
      - "5524:5524/udp"
      - "5524:5524/tcp"
      - "5525:5525/udp"
      - "5525:5525/tcp"
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "7779:7779/udp"
      - "7780:7780/udp"
      - "7781:7781/udp"
      - "7782:7782/udp"
      # Minecraft Java servers use TCP 25565-25570, starting at the game's default port.
      - "25565:25565/tcp"
      - "25566:25566/tcp"
      - "25567:25567/tcp"
      - "25568:25568/tcp"
      - "25569:25569/tcp"
      - "25570:25570/tcp"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HSM_DATA_DIR: /data
      HSM_LISTEN: ":8008"
      HSM_GAME_PORT_START: "5520"
      HSM_GAME_PORT_END: "5525"
      HSM_MINECRAFT_PORT_START: "25565"
      HSM_MINECRAFT_PORT_END: "25570"
      TZ: America/Vancouver
    stop_grace_period: 100s
